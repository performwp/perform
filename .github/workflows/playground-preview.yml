name: Playground Preview

on:
  workflow_run:
    workflows:
      - Playground Preview Build
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    name: Publish Playground preview comment
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-publish.yml@v3
    with:
      mode: comment
      blueprint-from-artifact: true
