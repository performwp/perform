name: Build Plugin Pre-Release

on:
  release:
    types: [ prereleased ]

jobs:
  build:
    name: Build Plugin Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: '--no-dev --prefer-dist --optimize-autoloader'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Generate and validate plugin artifact
        run: |
          npm run plugin-zip
          node tests/package/validate-package.mjs perform.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/perform.zip
